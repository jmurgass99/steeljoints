[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steeljoints"
version = "1.0.0"
description = "Steel joint design: bolts and bolt groups, fillet and groove welds, end plates, shear tabs, clip angles, splices, base plates and anchors, panel zones, prying, block shear, RBS and WUF-W (AISC 360-22, AISC 358, EN 1993-1-8, NSR-10 F.2, ACI 318-25 ch. 17)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["steel-connections", "joints", "aisc-360", "aisc-358", "en-1993-1-8", "bolts", "welds", "base-plate", "structural-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "httpx>=0.25", "pydantic>=2.0"]
dxf = ["ezdxf>=1.0"]
numeric = ["scipy>=1.10"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "coverage>=7.0", "hypothesis>=6.0", "pytest-timeout>=2.1"]
memos = ["handcalcs>=1.6", "forallpeople>=2.6"]

[project.urls]
Homepage = "https://github.com/jmurgass99/steeljoints"
Repository = "https://github.com/jmurgass99/steeljoints"
Issues = "https://github.com/jmurgass99/steeljoints/issues"

[tool.setuptools.packages.find]
include = ["steeljoints*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "property: property-based con hypothesis",
    "safety_critical: validados contra valores publicados",
]
